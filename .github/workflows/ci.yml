name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  platform-tests:
    name: Testes do pipeline (pytest + PySpark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: astral-sh/setup-uv@v6
      - run: cd platform && uv run --no-project --python 3.12 --with pytest --with "pyspark==4.0.*" pytest tests -q

  ingestion-tests:
    name: Testes da Lambda (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: cd ingestion && uv run --no-project --python 3.12 --with pytest pytest tests -q

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [infra/01-workspaces, infra/02-governance, infra/03-ingestion]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: ${{ matrix.stack }}
      - run: terraform init -backend=false -input=false && terraform validate
        working-directory: ${{ matrix.stack }}
