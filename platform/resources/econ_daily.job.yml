# Orquestração (Lakeflow Jobs): Bronze -> Silver -> Gold -> Qualidade, em compute SERVERLESS.
# Roda todo dia às 21h (a Lambda grava às 20h). Em DEV (mode: development) a agenda fica PAUSADA.
resources:
  jobs:
    econ_daily:
      name: econ-daily
      schedule:
        quartz_cron_expression: "0 0 21 * * ?"
        timezone_id: America/Sao_Paulo
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../src/notebooks/01_bronze.py
        - task_key: silver
          depends_on: [{ task_key: bronze }]
          notebook_task:
            notebook_path: ../src/notebooks/02_silver.py
        - task_key: gold
          depends_on: [{ task_key: silver }]
          notebook_task:
            notebook_path: ../src/notebooks/03_gold.py
        - task_key: qualidade
          depends_on: [{ task_key: gold }]
          notebook_task:
            notebook_path: ../src/notebooks/04_qualidade.py
